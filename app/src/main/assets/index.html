<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a10"><title>MultiverseofWatch</title>
<style>
:root{--bg:#090a10;--panel:#141621;--muted:#9ca3b5;--white:#f6f7fb;--purple:#9b7bff;--line:#282b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px system-ui,Arial}
header{padding:22px 18px 14px;background:linear-gradient(135deg,#17152a,#0b0c13)}
.brand{font-weight:850;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--purple)}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.search{margin:16px 0 2px;display:flex;gap:8px}input{width:100%;background:#202231;border:1px solid #34364a;color:white;padding:13px 14px;border-radius:13px;font-size:14px;outline:none}
nav{display:flex;gap:8px;padding:14px 14px 4px;overflow:auto}nav button,.chip{white-space:nowrap;border:1px solid var(--line);background:#151722;color:#c9cadd;padding:9px 13px;border-radius:30px}
nav button.active,.chip.active{background:var(--purple);color:#100d1d;border-color:var(--purple);font-weight:700}
main{padding:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.sectionhead h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:var(--panel);border:1px solid #222535;border-radius:15px;overflow:hidden;min-width:0}
.poster{height:205px;background:linear-gradient(135deg,#24243a,#141521);display:flex;align-items:center;justify-content:center;color:#777b91;font-size:12px}
.poster img{width:100%;height:100%;object-fit:cover}.info{padding:10px}.name{font-weight:700;font-size:14px;line-height:1.3;min-height:36px}.meta{color:var(--muted);font-size:11px;margin:6px 0 9px}
.actions{display:flex;gap:6px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;font-size:11px;padding:8px 5px;border-radius:9px;border:0;background:#28243e;color:#e9e3ff}
.actions button{background:#242635;color:#ddd}.empty{padding:24px 12px;text-align:center;color:var(--muted);grid-column:1/-1;background:#12141e;border-radius:14px}
footer{padding:25px 16px;color:#72778b;font-size:11px;text-align:center}
</style></head><body>
<header><div class="brand">MULTIVERSE<span>OFWATCH</span> ✦</div><div class="sub">Your personal universe of stories</div>
<div class="search"><input id="q" placeholder="Search anime or series..." autocomplete="off"></div></header>
<nav id="tabs">
<button class="active" data-kind="anime">Anime</button><button data-kind="series">Series</button><button data-kind="movie">Movies</button><button data-kind="animemovie">Anime Movies</button>
</nav>
<main><div class="sectionhead"><h2 id="heading">Popular Anime</h2><span class="hint" id="status">Discover something great</span></div>
<div class="grid" id="results"><div class="empty">Loading your multiverse…</div></div></main>
<footer>Ratings and posters are provided by public catalog services where available. Trailer buttons open YouTube search results.</footer>
<script>
const $=id=>document.getElementById(id); let kind='anime', timer;
const saved=JSON.parse(localStorage.getItem('mow_saved')||'[]');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(x){let title=x.title||x.name||'Untitled', score=x.score??x.rating?.average??'N/A', year=x.year||x.premiered?.slice(0,4)||'';
let poster=x.images?.jpg?.large_image_url||x.image?.original||x.image?.medium||'';
let trailer='https://www.youtube.com/results?search_query='+encodeURIComponent(title+' trailer official');
let key=title+'|'+kind, is=saved.includes(key);
return `<article class="card"><div class="poster">${poster?`<img loading="lazy" src="${esc(poster)}" onerror="this.parentElement.textContent='Poster unavailable'">`:'Poster unavailable'}</div><div class="info"><div class="name">${esc(title)}</div><div class="meta">★ ${esc(score)} &nbsp; ${esc(year)} ${x.type?'· '+esc(x.type):''}</div><div class="actions"><a href="${trailer}" target="_blank">▶ Trailer</a><button onclick="toggleSave('${encodeURIComponent(key)}')">${is?'♥ Saved':'＋ Save'}</button></div></div></article>`}
function render(items){$('results').innerHTML=items.length?items.map(card).join(''):'<div class="empty">No results found. Try another title.</div>';$('status').textContent=items.length+' titles';}
async function load(query=''){
$('heading').textContent={anime:'Anime',series:'TV Series',movie:'Movies',animemovie:'Anime Movies'}[kind];
$('status').textContent='Loading…';$('results').innerHTML='<div class="empty">Finding titles…</div>';
try{
let url, data=[];
if(kind==='anime'||kind==='animemovie'){
url='https://api.jikan.moe/v4/'+(query?'anime?q='+encodeURIComponent(query)+'&limit=24':'top/anime?limit=24');
let r=await fetch(url);let j=await r.json();data=j.data||[];
if(kind==='animemovie') data=data.filter(a=>a.type==='Movie');
}else if(kind==='series'){
url='https://api.tvmaze.com/search/shows?q='+encodeURIComponent(query||'popular');
let r=await fetch(url);let j=await r.json();data=j.map(v=>v.show);
}else{
$('status').textContent='Movie search';$('results').innerHTML=`<div class="empty">Movie catalog is ready to search on IMDb. <br><br><a style="color:#b9a5ff" href="https://www.imdb.com/search/title/?title=${encodeURIComponent(query||'popular')}" target="_blank">Open movie results on IMDb ↗</a><br><br>Use the Trailer button from IMDb to find official YouTube trailers.</div>`;return;
}
render(data);
}catch(e){$('results').innerHTML='<div class="empty">Could not load right now. Check your internet and try again.</div>';$('status').textContent='Offline';}
}
$('tabs').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');kind=e.target.dataset.kind;load($('q').value.trim());});
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load($('q').value.trim()),550);});
function toggleSave(encoded){let k=decodeURIComponent(encoded);saved.includes(k)?saved.splice(saved.indexOf(k),1):saved.push(k);localStorage.setItem('mow_saved',JSON.stringify(saved));load($('q').value.trim());}
load();
</script></body></html>
